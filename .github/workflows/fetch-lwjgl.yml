name: Fetch LWJGL runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-lwjgl:
    if: "!contains(github.event.head_commit.message, '[lwjgl]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LWJGL browser runtime
        run: |
          set -e
          mkdir -p lwjgl/libraries

          curl -L --fail --retry 3 -o lwjgl/lwjgl-2.9.3.jar             https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/lwjgl-2.9.3.jar

          curl -L --fail --retry 3 -o lwjgl/lwjgl_util-2.9.3.jar \
            https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/lwjgl_util-2.9.3.jar

          curl -L --fail --retry 3 -o lwjgl/libraries/lwjgl.js \
            https://raw.githubusercontent.com/leaningtech/cheerpj-natives/main/natives/lwjgl.js

          curl -L --fail --retry 3 -o lwjgl/libraries/jawt.js \
            https://raw.githubusercontent.com/leaningtech/cheerpj-natives/main/natives/jawt.js

      - name: Build browser game JAR
        run: |
          set -e
          rm -rf build launcher-src client-browser.jar
          mkdir -p build launcher-src

          cat > launcher-src/BrowserLauncher.java <<'EOF'
          package com.mojang.minecraft;

          public final class BrowserLauncher {
              private static final int WIDTH = 854;
              private static final int HEIGHT = 480;

              public static void main(String[] args) {
                  l minecraft = new l(
                      null,
                      null,
                      WIDTH,
                      HEIGHT,
                      false
                  );

                  minecraft.i = "localhost";
                  minecraft.k = true;

                  Thread thread = new Thread(minecraft);
                  thread.setName("Minecraft");
                  thread.start();
              }
          }
          EOF

          curl -L --fail --retry 3 -o asm.jar             https://repo1.maven.org/maven2/org/ow2/asm/asm/9.9/asm-9.9.jar

          cat > launcher-src/PatchMinecraft.java <<'EOF'
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import org.objectweb.asm.*;

          public final class PatchMinecraft {
              public static void main(String[] args) throws Exception {
                  byte[] input = Files.readAllBytes(
                      Paths.get("build/com/mojang/minecraft/l.class")
                  );

                  ClassReader cr = new ClassReader(input);
                  ClassWriter cw = new ClassWriter(cr, 0);

                  ClassVisitor cv = new ClassVisitor(Opcodes.ASM9, cw) {
                      @Override
                      public MethodVisitor visitMethod(
                          int access, String name, String desc,
                          String sig, String[] ex
                      ) {
                          MethodVisitor mv = super.visitMethod(
                              access, name, desc, sig, ex
                          );

                          if (!name.equals("<init>")) {
                              return mv;
                          }

                          return new MethodVisitor(Opcodes.ASM9, mv) {
                              @Override
                              public void visitMethodInsn(
                                  int opcode, String owner, String name,
                                  String descriptor, boolean isInterface
                              ) {
                                  if (owner.equals("javax/swing/UIManager") &&
                                      name.equals("getSystemLookAndFeelClassName")) {
                                      // Replace:
                                      //   UIManager.getSystemLookAndFeelClassName()
                                      // with:
                                      //   null
                                      super.visitInsn(Opcodes.ACONST_NULL);
                                      return;
                                  }

                                  if (owner.equals("javax/swing/UIManager") &&
                                      name.equals("setLookAndFeel")) {
                                      // Replace:
                                      //   UIManager.setLookAndFeel(null)
                                      // with:
                                      //   pop
                                      super.visitInsn(Opcodes.POP);
                                      return;
                                  }

                                  super.visitMethodInsn(
                                      opcode, owner, name, descriptor, isInterface
                                  );
                              }
                          };
                      }
                  };

                  cr.accept(cv, 0);
                  Files.write(
                      Paths.get("build/com/mojang/minecraft/l.class"),
                      cw.toByteArray()
                  );
              }
          }
          EOF

          javac -source 8 -target 8 -cp asm.jar -d launcher-src             launcher-src/PatchMinecraft.java

          # Extract the original client first so the patcher can modify l.class.
          cd build
          jar xf ../client.jar
          cd ..

          java -cp asm.jar:launcher-src PatchMinecraft

          javac -source 8 -target 8             -cp build:lwjgl/lwjgl-2.9.3.jar:lwjgl/lwjgl_util-2.9.3.jar             -d launcher-src launcher-src/BrowserLauncher.java

          cd build
          jar xf ../lwjgl/lwjgl-2.9.3.jar
          jar xf ../lwjgl/lwjgl_util-2.9.3.jar
          cp ../launcher-src/com/mojang/minecraft/BrowserLauncher.class             com/mojang/minecraft/
          rm -f META-INF/*.SF META-INF/*.RSA META-INF/*.DSA 2>/dev/null || true
          jar cf ../client-browser.jar .
          cd ..

          test -s client-browser.jar
          jar tf client-browser.jar | grep -q '^org/lwjgl/BufferUtils.class$'
          jar tf client-browser.jar | grep -q '^com/mojang/minecraft/BrowserLauncher.class$'

      - name: Commit browser runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lwjgl client-browser.jar
          if git diff --cached --quiet; then
            echo "Browser runtime is already up to date."
            exit 0
          fi
          git commit -m "Restore browser LWJGL patch [lwjgl]"
          git push
