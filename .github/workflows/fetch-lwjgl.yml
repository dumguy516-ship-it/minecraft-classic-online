name: Fetch LWJGL runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-lwjgl:
    if: "!contains(github.event.head_commit.message, '[lwjgl]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LWJGL browser runtime
        run: |
          set -e
          mkdir -p lwjgl/libraries

          curl -L --fail --retry 3 -o lwjgl/lwjgl-2.9.3.jar             https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/lwjgl-2.9.3.jar

          curl -L --fail --retry 3 -o lwjgl/lwjgl_util-2.9.3.jar             https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/lwjgl_util-2.9.3.jar

          curl -L --fail --retry 3 -o lwjgl/libraries/liblwjgl.so             https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/libraries/liblwjgl.so

          curl -L --fail --retry 3 -o lwjgl/libraries/gl4es.wasm             https://raw.githubusercontent.com/leaningtech/browsercraft/main/static/lwjgl/libraries/gl4es.wasm

      - name: Build browser game JAR
        run: |
          set -e
          rm -rf build launcher-src client-browser.jar
          mkdir -p build launcher-src

          cat > launcher-src/BrowserLauncher.java <<'EOF'
          package com.mojang.minecraft;

          import java.awt.Canvas;

          public final class BrowserLauncher {
              private static final int WIDTH = 854;
              private static final int HEIGHT = 480;

              public static void main(String[] args) {
                  Canvas canvas = new Canvas();
                  canvas.setFocusable(true);

                  l minecraft = new l(
                      canvas,
                      null,
                      WIDTH,
                      HEIGHT,
                      false
                  );

                  minecraft.i = "localhost";
                  minecraft.k = true;

                  Thread thread = new Thread(minecraft);
                  thread.setName("Minecraft");
                  thread.start();
              }
          }
          EOF

          javac -source 8 -target 8 -cp client.jar:lwjgl/lwjgl-2.9.3.jar:lwjgl/lwjgl_util-2.9.3.jar             -d launcher-src launcher-src/BrowserLauncher.java

          cd build
          jar xf ../client.jar
          jar xf ../lwjgl/lwjgl-2.9.3.jar
          jar xf ../lwjgl/lwjgl_util-2.9.3.jar
          cp ../launcher-src/com/mojang/minecraft/BrowserLauncher.class com/mojang/minecraft/
          rm -f META-INF/*.SF META-INF/*.RSA META-INF/*.DSA 2>/dev/null || true
          jar cf ../client-browser.jar .
          cd ..

          test -s client-browser.jar
          jar tf client-browser.jar | grep -q '^org/lwjgl/BufferUtils.class$'
          jar tf client-browser.jar | grep -q '^com/mojang/minecraft/BrowserLauncher.class$'

      - name: Commit browser runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lwjgl client-browser.jar
          if git diff --cached --quiet; then
            echo "Browser runtime is already up to date."
            exit 0
          fi
          git commit -m "Use direct Minecraft launcher without applet [lwjgl]"
          git push
