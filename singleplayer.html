<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Classic - Single Player</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
        #display { width: 854px; height: 480px; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: white; background: #000; font-family: Arial, Helvetica, sans-serif; font-size: 16px; z-index: 10; }
        #loading.hidden { display: none; }
        #error { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 650px; max-width: 90%; padding: 20px; box-sizing: border-box; color: white; background: #222; border: 1px solid #555; font-family: Arial, Helvetica, sans-serif; font-size: 14px; z-index: 20; }
        #error h1 { margin: 0 0 12px 0; font-size: 20px; }
        #error p { margin: 8px 0; }
    </style>
    <!-- Direct LWJGL launcher build v4: native runtime enabled -->
</head>
<body>
<div id="loading">Loading Minecraft Classic...</div>
<div id="error">
    <h1>Minecraft could not start</h1>
    <p id="error-text">The Java runtime failed to start Minecraft.</p>
    <p>Open the browser console if this message remains.</p>
</div>
<div id="game"><div id="display"></div></div>

<script>
(async function () {
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const errorText = document.getElementById("error-text");
    const display = document.getElementById("display");

    try {
        const appRoot = "/app/minecraft-classic-online";

        await cheerpjInit({
            version: 8,
            javaProperties: [
                "java.library.path=" + appRoot + "/lwjgl/libraries"
            ],
            libraries: {
                "libGL.so.1": appRoot + "/lwjgl/libraries/gl4es.wasm"
            },
            enableX11: true
        });

        await cheerpjCreateDisplay(854, 480, display);
        const lwjglCanvas = display.querySelector("canvas");
        if (!lwjglCanvas) throw new Error("CheerpJ display canvas was not created");
        window.lwjglCanvasElement = lwjglCanvas;
        loading.classList.add("hidden");

        const exitCode = await cheerpjRunMain(
            "com.mojang.minecraft.BrowserLauncher",
            appRoot + "/client-browser.jar"
        );

        console.log("Minecraft exited with code:", exitCode);
    } catch (err) {
        console.error("Minecraft failed to start:", err);
        loading.classList.add("hidden");
        error.style.display = "block";
        errorText.textContent =
            "Minecraft could not start: " +
            (err && err.message ? err.message : String(err));
    }
})();
</script>
</body>
</html>
