<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Classic - Single Player</title>

    <!-- CheerpJ Java runtime -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        cheerpj-applet {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            background: #000;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;

            z-index: 10;
        }

        #loading.hidden {
            display: none;
        }

        #error {
            display: none;

            position: fixed;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 600px;
            max-width: 90%;

            padding: 20px;

            box-sizing: border-box;

            color: white;
            background: #222;

            border: 1px solid #555;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            z-index: 20;
        }

        #error h1 {
            margin: 0 0 12px 0;
            font-size: 20px;
        }

        #error p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

<div id="loading">
    Loading Minecraft Classic...
</div>

<div id="error">
    <h1>Minecraft could not start</h1>
    <p id="error-text">
        The Java runtime failed to start the Minecraft client.
    </p>
    <p>
        Check the browser console for the detailed error.
    </p>
</div>

<div id="game">

    <!--
        Minecraft Classic 0.30

        Original applet entry point:
        com.mojang.minecraft.MinecraftApplet

        The JAR is in the same directory as this HTML file.
    -->

    <cheerpj-applet
        archive="client.jar"
        code="com.mojang.minecraft.MinecraftApplet"
        width="854"
        height="480">

        Minecraft Classic requires Java.

    </cheerpj-applet>

</div>

<script>
(async function () {

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const errorText = document.getElementById("error-text");

    try {

        /*
         * Minecraft Classic 0.30 is a Java 5/6-era applet.
         *
         * CheerpJ's applet mode uses the compatible Java environment.
         */
        await cheerpjInit({
            version: 8
        });

        loading.classList.add("hidden");

    } catch (err) {

        console.error("Minecraft failed to start:", err);

        loading.classList.add("hidden");
        error.style.display = "block";

        errorText.textContent =
            "CheerpJ could not initialize: " +
            (err && err.message ? err.message : err);

    }

})();
</script>

</body>
</html>
